<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="googlebot" content="noindex, nofollow, noarchive">
  <title>Fringe Planner</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <style>
    :root { --bg:#f7f4ef; --paper:#fffdf8; --ink:#191713; --muted:#68635c; --line:#ddd4c8; --soft:#ece5da; --accent:#b92f2f; --teal:#0d6b5f; --banner:#e84b92; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif; line-height:1.35; }
    header { position:sticky; top:0; z-index:5; background:var(--banner); color:white; border-bottom:1px solid rgba(255,255,255,.25); backdrop-filter:blur(10px); }
    .top { max-width:1180px; margin:0 auto; padding:14px 14px 12px; }
    h1 { font-size:22px; margin:0 0 4px; }
    header .sub, header .muted, header label { color:rgba(255,255,255,.88); }
    .sub,.muted,.meta,.price,.venue,.location,.why,.desc { color:var(--muted); font-size:13px; }
    .controls { display:grid; grid-template-columns:1.4fr 160px 115px 115px 145px; gap:8px; align-items:end; margin-top:10px; }
    label { display:grid; gap:4px; font-size:12px; font-weight:700; color:#47413a; }
    input,select { height:40px; border:1px solid var(--line); border-radius:7px; padding:0 10px; background:white; color:var(--ink); font-size:14px; min-width:0; }
    .quick,.tabs { display:flex; gap:7px; flex-wrap:wrap; margin-top:10px; }
    button,.tab { min-height:34px; border:1px solid var(--line); border-radius:7px; padding:0 10px; background:white; color:var(--ink); cursor:pointer; font-size:13px; font-weight:650; }
    .tab.active { background:var(--accent); border-color:var(--accent); color:white; }
    .genre-select { position:relative; margin-top:10px; max-width:360px; }
    .genre-select summary { height:38px; border:1px solid var(--line); background:white; color:var(--ink); border-radius:7px; padding:0 12px; display:flex; align-items:center; justify-content:space-between; cursor:pointer; font-size:13px; }
    .genre-menu { position:absolute; top:42px; left:0; right:0; max-height:330px; overflow:auto; background:white; border:1px solid var(--line); border-radius:7px; box-shadow:0 14px 28px rgba(20,15,10,.14); padding:8px; z-index:10; }
    .checkrow { display:flex; gap:8px; align-items:center; padding:7px 6px; border-radius:5px; color:var(--ink); font-size:13px; cursor:pointer; }
    .checkrow:hover { background:var(--soft); }
    .checkrow input { accent-color:var(--teal); }
    main { max-width:1480px; margin:0 auto; padding:14px 14px 56px; }
    .summary,.totals { display:flex; gap:10px; flex-wrap:wrap; align-items:center; color:var(--muted); font-size:14px; margin-bottom:12px; }
    .summary strong,.totals strong { color:var(--ink); }
    .split-view { display:grid; grid-template-columns:minmax(0,1fr) minmax(380px,48%); gap:14px; align-items:start; }
    .list-pane { min-width:0; }
    .map-pane { position:sticky; top:142px; min-width:0; }
    .map-shell { background:var(--paper); border:1px solid var(--line); border-radius:7px; overflow:hidden; margin:0 0 14px; }
    .map-head { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:9px 10px; border-bottom:1px solid var(--line); }
    .map-head strong { font-size:14px; }
    .map-note { color:var(--muted); font-size:12px; }
    .map { height:calc(100vh - 188px); min-height:430px; width:100%; background:#ece5da; }
    .distance-list { display:grid; gap:7px; padding:10px; border-top:1px solid var(--line); font-size:13px; color:var(--muted); }
    .distance-list div { display:flex; justify-content:space-between; gap:12px; border-bottom:1px solid #eee7dd; padding-bottom:7px; }
    .distance-list div:last-child { border-bottom:0; padding-bottom:0; }
    .leaflet-popup-content { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif; font-size:13px; }
    .panel { display:none; }
    .panel.active { display:block; }
    .dayhead { display:flex; justify-content:space-between; align-items:end; margin:18px 0 9px; border-bottom:2px solid var(--ink); padding-bottom:6px; }
    h2 { font-size:20px; margin:0; }
    .slot { display:grid; grid-template-columns:72px 1fr; background:var(--paper); border:1px solid var(--line); border-bottom:0; }
    .slot:last-child { border-bottom:1px solid var(--line); }
    .time { padding:10px; font-weight:850; color:var(--accent); background:#fbf7ef; border-right:1px solid var(--line); font-variant-numeric:tabular-nums; }
    .event { display:grid; grid-template-columns:58px minmax(220px,1.35fr) minmax(150px,.75fr) 102px 105px 86px; gap:10px; align-items:start; padding:9px 10px; border-bottom:1px solid #eee7dd; }
    .event:last-child { border-bottom:0; }
    .event.map-hover,.schedule-card.map-hover { outline:2px solid var(--accent); outline-offset:-2px; background:#fff8f8; }
    .start { font-weight:850; font-variant-numeric:tabular-nums; }
    a { color:var(--teal); text-decoration:none; }
    a:hover { text-decoration:underline; }
    .title { color:var(--ink); font-weight:800; }
    .tag { display:inline-flex; margin-top:4px; padding:2px 6px; border-radius:5px; background:var(--soft); font-size:12px; color:#312e2a; }
    .cat { background:#e4f0ed; color:#104d45; }
    .signal { display:inline-flex; gap:5px; align-items:center; padding:4px 7px; border-radius:6px; border:1px solid #e0c072; background:#f5e8c8; color:#2f2410; font-size:12px; font-weight:850; }
    .add.added { background:var(--teal); color:white; border-color:var(--teal); }
    .action,.schedule-actions { display:flex; flex-direction:column; gap:6px; align-items:stretch; }
    .ticket-link { min-height:34px; border:1px solid var(--line); border-radius:7px; padding:8px 10px; background:white; color:var(--teal); font-size:13px; font-weight:750; text-align:center; }
    .ticket-link:hover { text-decoration:none; background:#f5fbf9; }
    details { grid-column:2 / -1; color:var(--muted); font-size:13px; }
    summary { cursor:pointer; color:var(--teal); width:max-content; }
    .schedule-card { display:grid; grid-template-columns:72px 1fr minmax(150px,.7fr) 116px; gap:10px; background:var(--paper); border:1px solid var(--line); border-radius:7px; padding:10px; margin:8px 0; }
    .schedule-card.conflict { border-color:#c63838; background:#fff6f4; }
    .schedule-card.bought { border-color:#78b89f; background:#f3fbf6; }
    .bought-toggle { display:flex; align-items:center; gap:7px; min-height:34px; border:1px solid var(--line); border-radius:7px; padding:7px 9px; background:white; color:var(--ink); font-size:13px; font-weight:750; }
    .bought-toggle input,.checkrow input { height:auto; min-width:auto; }
    .conflict { color:#a42a2a; font-size:12px; font-weight:850; margin-top:3px; }
    .empty { background:white; border:1px solid var(--line); border-radius:7px; padding:22px; color:var(--muted); }
    .more-wrap { display:flex; justify-content:center; padding:16px 0 6px; }
    .more-wrap button { min-width:150px; background:var(--ink); color:white; border-color:var(--ink); }
    .hidden { display:none !important; }
    @media (max-width:850px) {
      header { position:static; }
      .split-view { grid-template-columns:1fr; }
      .map-pane { position:static; order:-1; }
      .controls { grid-template-columns:1fr 1fr; }
      .controls label:first-child { grid-column:1 / -1; }
      .slot { grid-template-columns:1fr; }
      .time { border-right:0; border-bottom:1px solid var(--line); }
      .event { grid-template-columns:52px 1fr; }
      .venue,.location,.signalwrap,.price,.action,details { grid-column:2; }
      .schedule-card { grid-template-columns:58px 1fr; }
      .schedule-card button,.schedule-card .venue,.schedule-card .schedule-actions { grid-column:2; }
      .map { height:310px; min-height:310px; }
      .distance-list div { display:block; }
    }
    @media (max-width:540px) {
      .controls { grid-template-columns:1fr; }
      h1 { font-size:20px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="top">
      <h1>Fringe Planner</h1>
      <div class="sub">Shared schedule for 14-16 August. Events and schedule are loaded from Supabase.</div>
      <div class="controls">
        <label>Search <input id="search" type="search" placeholder="Title, artist, venue, genre..."></label>
        <label>Date <select id="dateFilter"><option value="">All dates</option><option value="2026-08-14" selected>Friday 14 Aug</option><option value="2026-08-15">Saturday 15 Aug</option><option value="2026-08-16">Sunday 16 Aug</option></select></label>
        <label>From <input id="startAfter" type="time" step="300" value="17:00"></label>
        <label>To <input id="startBefore" type="time" step="300" value="23:59"></label>
        <label>Min Signal <select id="minSignal"><option value="">Any</option><option value="5">5/5 must-check</option><option value="4">4/5 high+</option><option value="3">3/5 notable+</option></select></label>
      </div>
      <div class="quick">
        <button data-preset="09:00-12:00">Morning</button>
        <button data-preset="12:00-17:00">Afternoon</button>
        <button data-preset="17:00-20:00">5-8pm</button>
        <button data-preset="20:00-23:59">Late</button>
        <button id="clearFilters">Clear Filters</button>
      </div>
      <div class="genre-select">
        <details>
          <summary><span id="genreSummary">Genres: Any</span><span>v</span></summary>
          <div id="genreMenu" class="genre-menu"></div>
        </details>
      </div>
      <div class="tabs">
        <button id="browseTab" class="tab active">Browse</button>
        <button id="scheduleTab" class="tab">My Schedule (0)</button>
      </div>
    </div>
  </header>
  <main>
    <section id="browsePanel" class="panel active">
      <div class="summary"><span><strong id="visibleCount">0</strong> visible events</span><span id="rangeLabel">Loading...</span></div>
      <div class="split-view">
        <div id="browseBody" class="list-pane empty">Loading events from Supabase...</div>
        <aside class="map-pane">
          <div class="map-shell">
            <div class="map-head"><strong>Browse Map</strong><span id="browseMapNote" class="map-note">Loading venues...</span></div>
            <div id="browseMap" class="map"></div>
          </div>
        </aside>
      </div>
    </section>
    <section id="schedulePanel" class="panel">
      <div class="totals"><span><strong id="scheduleCount">0</strong> shows</span><span><strong id="scheduleCost">£0.00</strong> estimated total</span><button id="clearSchedule">Clear Schedule</button></div>
      <div class="split-view">
        <div id="scheduleBody" class="list-pane empty">Loading schedule...</div>
        <aside class="map-pane">
          <div class="map-shell">
            <div class="map-head"><strong>Schedule Map</strong><span id="scheduleMapNote" class="map-note">Add shows to map your route.</span></div>
            <div id="scheduleMap" class="map"></div>
            <div id="distanceList" class="distance-list hidden"></div>
          </div>
        </aside>
      </div>
    </section>
  </main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    const SUPABASE_URL = 'https://ewiqrnibawljigzooxrn.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_FJ20NGH-tgVKN6Fx9fEZMA_3rvfapVC';
    const TRIP_ID = 'fringe-2026';
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    const days = {'2026-08-14':'Friday 14 August','2026-08-15':'Saturday 15 August','2026-08-16':'Sunday 16 August'};
    let events = [];
    let scheduleIds = new Set();
    let boughtTickets = new Map();
    let activeGenres = new Set();
    let visibleEvents = [];
    let displayLimit = 100;
    let searchTimer;
    let browseMap;
    let scheduleMap;
    let browseLayer;
    let scheduleLayer;
    let scheduleRoute;
    let mapReady = false;
    let browseMapRun = 0;
    let scheduleMapRun = 0;
    let browseMarkersByKey = new Map();
    let scheduleMarkersByKey = new Map();
    let geocodeQueue = Promise.resolve();
    const geocodeCacheKey = 'fringeVenueGeocodeCacheV1';
    const edinburghCenter = [55.9533, -3.1883];
    let geocodeCache = {};

    const $ = id => document.getElementById(id);
    const esc = s => String(s ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    const isTicketColumnError = error => /ticket_bought|column/i.test(String(error?.message || ''));
    const showSlug = title => String(title || '')
      .toLowerCase()
      .replace(/&/g, ' and ')
      .replace(/[^a-z0-9]+/g, '-')
      .replace(/^-+|-+$/g, '');
    const ticketUrl = event => String(event.ticket_url || '').trim() || `https://www.edfringe.com/tickets/whats-on/${showSlug(event.title)}`;
    const timeToMin = t => { const [h,m] = String(t || '00:00').split(':').map(Number); return h * 60 + m; };
    const minToTime = mins => String(Math.floor(mins/60)).padStart(2,'0') + ':' + String(mins % 60).padStart(2,'0');
    const money = value => '£' + Number(value || 0).toFixed(2);
    const venueBase = event => String(event.venue || event.location || '').replace(/\s*\([^)]*\)\s*$/g, '').trim();
    const venueKey = event => `${venueBase(event)}|${event.location || ''}`.toLowerCase();
    const approxWalkMins = km => Math.max(1, Math.round((km * 1.25 / 4.8) * 60));
    const markerStyle = { radius: 7, color: '#0d6b5f', weight: 2, fillColor: '#0d6b5f', fillOpacity: 0.72 };
    const markerActiveStyle = { radius: 13, color: '#b92f2f', weight: 4, fillColor: '#e84b92', fillOpacity: 0.92 };

    try {
      geocodeCache = JSON.parse(localStorage.getItem(geocodeCacheKey) || '{}');
    } catch {
      geocodeCache = {};
    }

    function initMaps() {
      if (mapReady) return;
      if (!window.L) {
        $('browseMapNote').textContent = 'Map library could not load.';
        $('scheduleMapNote').textContent = 'Map library could not load.';
        return;
      }
      browseMap = L.map('browseMap', { scrollWheelZoom: false }).setView(edinburghCenter, 13);
      scheduleMap = L.map('scheduleMap', { scrollWheelZoom: false }).setView(edinburghCenter, 13);
      [browseMap, scheduleMap].forEach(map => {
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19,
          attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);
      });
      browseLayer = L.layerGroup().addTo(browseMap);
      scheduleLayer = L.layerGroup().addTo(scheduleMap);
      mapReady = true;
    }

    function uniqueVenues(sourceEvents, limit = 80) {
      const venues = new Map();
      sourceEvents.forEach(event => {
        const base = venueBase(event);
        if (!base) return;
        const key = venueKey(event);
        if (!venues.has(key)) venues.set(key, { key, base, events: [] });
        venues.get(key).events.push(event);
      });
      return [...venues.values()].slice(0, limit);
    }

    async function geocodeVenue(venue) {
      if (geocodeCache[venue.key]) return geocodeCache[venue.key];
      geocodeQueue = geocodeQueue.then(async () => {
        if (geocodeCache[venue.key]) return geocodeCache[venue.key];
        try {
          const query = encodeURIComponent(`${venue.base}, Edinburgh, Scotland`);
          const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${query}`);
          if (!response.ok) return null;
          const results = await response.json();
          const first = results && results[0];
          if (!first) return null;
          const coords = { lat: Number(first.lat), lng: Number(first.lon) };
          geocodeCache[venue.key] = coords;
          localStorage.setItem(geocodeCacheKey, JSON.stringify(geocodeCache));
          return coords;
        } finally {
          await new Promise(resolve => setTimeout(resolve, 1100));
        }
      }).catch(() => null);
      return geocodeQueue;
    }

    async function resolveVenues(venues, noteEl, label) {
      let mapped = 0;
      noteEl.textContent = `Locating ${venues.length} ${label}...`;
      const resolved = [];
      for (const venue of venues) {
        const coords = await geocodeVenue(venue);
        if (coords) {
          mapped += 1;
          resolved.push({ ...venue, ...coords });
          noteEl.textContent = `Mapped ${mapped}/${venues.length} ${label}`;
        }
      }
      return resolved;
    }

    function markerPopup(venue) {
      const first = venue.events[0];
      const shown = venue.events.slice(0, 5).map(event => `<div>${esc(String(event.start).slice(0,5))} ${esc(event.title)}</div>`).join('');
      const more = venue.events.length > 5 ? `<div class="muted">+${venue.events.length - 5} more</div>` : '';
      return `<strong>${esc(venue.base)}</strong><div class="meta">${esc(first.location || '')}</div>${shown}${more}<a target="_blank" rel="noopener" href="${esc(first.maps_search)}">Open in Google Maps</a>`;
    }

    function distanceKm(a, b) {
      const rad = Math.PI / 180;
      const dLat = (b.lat - a.lat) * rad;
      const dLng = (b.lng - a.lng) * rad;
      const lat1 = a.lat * rad;
      const lat2 = b.lat * rad;
      const h = Math.sin(dLat / 2) ** 2 + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLng / 2) ** 2;
      return 6371 * 2 * Math.atan2(Math.sqrt(h), Math.sqrt(1 - h));
    }

    function fitMap(map, points) {
      setTimeout(() => {
        map.invalidateSize();
        if (!points.length) map.setView(edinburghCenter, 13);
        else map.fitBounds(points.map(p => [p.lat, p.lng]), { padding: [28, 28], maxZoom: 16 });
      }, 80);
    }

    function setMarkerHighlight(marker, active) {
      if (!marker) return;
      marker.setStyle(active ? markerActiveStyle : markerStyle);
      if (active) marker.bringToFront();
    }

    function attachMapHover(containerSelector) {
      document.querySelectorAll(`${containerSelector} [data-map-key]`).forEach(card => {
        if (card.dataset.mapHoverBound) return;
        card.dataset.mapHoverBound = 'true';
        const key = card.dataset.mapKey;
        const markers = () => containerSelector === '#scheduleBody' ? scheduleMarkersByKey : browseMarkersByKey;
        card.addEventListener('mouseenter', () => {
          card.classList.add('map-hover');
          setMarkerHighlight(markers().get(key), true);
        });
        card.addEventListener('mouseleave', () => {
          card.classList.remove('map-hover');
          setMarkerHighlight(markers().get(key), false);
        });
      });
    }

    async function renderBrowseMap() {
      const run = ++browseMapRun;
      initMaps();
      if (!mapReady) return;
      const venues = uniqueVenues(visibleEvents.slice(0, displayLimit), 80);
      browseLayer.clearLayers();
      browseMarkersByKey = new Map();
      if (!venues.length) {
        $('browseMapNote').textContent = 'No venues to map.';
        fitMap(browseMap, []);
        return;
      }
      const resolved = await resolveVenues(venues, $('browseMapNote'), 'venues');
      if (run !== browseMapRun) return;
      resolved.forEach(venue => {
        const marker = L.circleMarker([venue.lat, venue.lng], markerStyle).bindPopup(markerPopup(venue)).addTo(browseLayer);
        browseMarkersByKey.set(venue.key, marker);
      });
      attachMapHover('#browseBody');
      $('browseMapNote').textContent = `${resolved.length}/${venues.length} venues mapped from visible results`;
      fitMap(browseMap, resolved);
    }

    async function renderScheduleMap() {
      const run = ++scheduleMapRun;
      initMaps();
      if (!mapReady) return;
      const selected = events.filter(event => scheduleIds.has(event.id)).sort((a,b) => a.date.localeCompare(b.date) || timeToMin(a.start) - timeToMin(b.start));
      const venues = uniqueVenues(selected, 80);
      scheduleLayer.clearLayers();
      scheduleMarkersByKey = new Map();
      if (scheduleRoute) {
        scheduleMap.removeLayer(scheduleRoute);
        scheduleRoute = null;
      }
      $('distanceList').classList.add('hidden');
      $('distanceList').innerHTML = '';
      if (!venues.length) {
        $('scheduleMapNote').textContent = 'Add shows to map your route.';
        fitMap(scheduleMap, []);
        return;
      }
      const resolved = await resolveVenues(venues, $('scheduleMapNote'), 'stops');
      if (run !== scheduleMapRun) return;
      const byKey = new Map(resolved.map(venue => [venue.key, venue]));
      resolved.forEach((venue, index) => {
        const marker = L.circleMarker([venue.lat, venue.lng], markerStyle).bindPopup(`<strong>${index + 1}. ${esc(venue.base)}</strong><div class="meta">${esc(venue.events[0].location || '')}</div>${venue.events.slice(0, 5).map(event => `<div>${esc(String(event.start).slice(0,5))} ${esc(event.title)}</div>`).join('')}<a target="_blank" rel="noopener" href="${esc(venue.events[0].maps_search)}">Open in Google Maps</a>`).addTo(scheduleLayer);
        scheduleMarkersByKey.set(venue.key, marker);
      });
      attachMapHover('#scheduleBody');
      const routeStops = selected.map(event => {
        const venue = byKey.get(venueKey(event));
        return venue ? { event, venue, lat: venue.lat, lng: venue.lng } : null;
      }).filter(Boolean);
      if (routeStops.length > 1) {
        scheduleRoute = L.polyline(routeStops.map(p => [p.lat, p.lng]), { color: '#b92f2f', weight: 3 }).addTo(scheduleMap);
        const legs = [];
        for (let i = 1; i < routeStops.length; i += 1) {
          const a = routeStops[i - 1];
          const b = routeStops[i];
          if (a.venue.key === b.venue.key) continue;
          const km = distanceKm(a, b);
          legs.push(`<div><span>${esc(a.event.title)} -> ${esc(b.event.title)}</span><strong>${km.toFixed(1)} km · ~${approxWalkMins(km)} min walk</strong></div>`);
        }
        if (legs.length) {
          $('distanceList').innerHTML = legs.join('');
          $('distanceList').classList.remove('hidden');
        }
      }
      $('scheduleMapNote').textContent = `${resolved.length}/${venues.length} stops mapped`;
      fitMap(scheduleMap, resolved);
    }

    async function fetchAllEvents() {
      const pageSize = 1000;
      let from = 0;
      let all = [];
      while (true) {
        const { data, error } = await supabase
          .from('events')
          .select('*')
          .order('date', { ascending: true })
          .order('start', { ascending: true })
          .range(from, from + pageSize - 1);
        if (error) throw error;
        all = all.concat(data || []);
        if (!data || data.length < pageSize) break;
        from += pageSize;
      }
      events = all;
      buildGenreMenu();
      applyFilters();
    }

    async function fetchSchedule() {
      let { data, error } = await supabase.from('schedule_items').select('event_id,ticket_bought').eq('trip_id', TRIP_ID);
      if (error && isTicketColumnError(error)) {
        ({ data, error } = await supabase.from('schedule_items').select('event_id').eq('trip_id', TRIP_ID));
      }
      if (error) throw error;
      scheduleIds = new Set((data || []).map(row => row.event_id));
      boughtTickets = new Map((data || []).map(row => [row.event_id, Boolean(row.ticket_bought)]));
      renderSchedule();
      updateAddButtons();
    }

    function buildGenreMenu() {
      const counts = new Map();
      const add = value => {
        const v = String(value || '').trim();
        if (v.length >= 3 && v.length <= 34) counts.set(v, (counts.get(v) || 0) + 1);
      };
      events.forEach(event => {
        add(event.category);
        String(event.genre || '').split(/[,/]/).forEach(add);
      });
      const options = [...counts.entries()].sort((a,b) => b[1] - a[1]).slice(0, 48).map(([name]) => name);
      $('genreMenu').innerHTML = options.map(name => `<label class="checkrow"><input class="genrecheck" type="checkbox" value="${esc(name)}"> <span>${esc(name)}</span></label>`).join('');
      document.querySelectorAll('.genrecheck').forEach(input => input.addEventListener('change', () => {
        if (input.checked) activeGenres.add(input.value);
        else activeGenres.delete(input.value);
        updateGenreSummary();
        displayLimit = 100;
        applyFilters();
      }));
    }

    function updateGenreSummary() {
      $('genreSummary').textContent = activeGenres.size === 0 ? 'Genres: Any' : activeGenres.size === 1 ? [...activeGenres][0] : `${activeGenres.size} genres selected`;
    }

    function eventTags(event) {
      return [event.category, ...String(event.genre || '').split(/[,/]/)].map(s => String(s || '').trim()).filter(Boolean);
    }

    function applyFilters() {
      const q = $('search').value.trim().toLowerCase();
      const date = $('dateFilter').value;
      const from = $('startAfter').value ? timeToMin($('startAfter').value) : 0;
      const to = $('startBefore').value ? timeToMin($('startBefore').value) : 1439;
      const minSignal = Number($('minSignal').value || 0);
      visibleEvents = events.filter(event => {
        const startMin = timeToMin(event.start);
        const hay = [event.title,event.company,event.category,event.genre,event.venue,event.location,event.description,event.signal_label,event.signal_reasons].join(' ').toLowerCase();
        const tags = eventTags(event);
        return (!date || event.date === date)
          && startMin >= from
          && startMin <= to
          && Number(event.signal_score || 0) >= minSignal
          && (!activeGenres.size || [...activeGenres].some(g => tags.includes(g)))
          && (!q || hay.includes(q));
      });
      $('visibleCount').textContent = visibleEvents.length.toLocaleString();
      const bits = [];
      if (date) bits.push(days[date]);
      bits.push(`${$('startAfter').value || '00:00'}-${$('startBefore').value || '23:59'}`);
      if (activeGenres.size) bits.push([...activeGenres].join(', '));
      if (minSignal) bits.push(`${minSignal}/5+ signal`);
      if (q) bits.push(`"${q}"`);
      $('rangeLabel').textContent = bits.join(' · ');
      renderBrowse();
      renderBrowseMap();
    }

    function renderBrowse() {
      if (!visibleEvents.length) {
        $('browseBody').className = 'empty';
        $('browseBody').innerHTML = 'No events match the current filters.';
        return;
      }
      $('browseBody').className = '';
      const renderedEvents = visibleEvents.slice(0, displayLimit);
      const hiddenCount = Math.max(visibleEvents.length - renderedEvents.length, 0);
      const byDay = groupBy(renderedEvents, e => e.date);
      $('browseBody').innerHTML = Object.keys(byDay).sort().map(date => {
        const byBucket = groupBy(byDay[date], e => e.bucket || e.start?.slice(0,5) || '00:00');
        return `<section><div class="dayhead"><h2>${days[date] || date}</h2><div class="muted">${byDay[date].length.toLocaleString()} events</div></div>` +
          Object.keys(byBucket).sort().map(bucket => `<div class="slot"><div class="time">${esc(String(bucket).slice(0,5))}</div><div>${byBucket[bucket].map(renderEvent).join('')}</div></div>`).join('') +
          `</section>`;
      }).join('') + (hiddenCount ? `<div class="more-wrap"><button id="showMore">Show 100 more (${hiddenCount.toLocaleString()} hidden)</button></div>` : '');
      $('showMore')?.addEventListener('click', () => {
        displayLimit += 100;
        renderBrowse();
        renderBrowseMap();
      });
      document.querySelectorAll('.add').forEach(btn => btn.addEventListener('click', () => toggleSchedule(btn.dataset.id)));
      attachMapHover('#browseBody');
      updateAddButtons();
    }

    function renderEvent(event) {
      const added = scheduleIds.has(event.id);
      const tags = [event.category, event.genre].filter(Boolean).map((t,i) => `<span class="tag ${i===0 ? 'cat' : ''}">${esc(t)}</span>`).join(' ');
      return `<article class="event" data-map-key="${esc(venueKey(event))}">
        <div class="start">${esc(String(event.start).slice(0,5))}</div>
        <div><a class="title" target="_blank" rel="noopener" href="${esc(ticketUrl(event))}">${esc(event.title)}</a><div class="meta">${esc(event.company)}</div>${tags}</div>
        <div class="venue"><a target="_blank" rel="noopener" href="${esc(event.maps_search)}">${esc(event.venue || 'Map search')}</a><div class="location">${esc(event.location)}</div></div>
        <div class="signalwrap"><div class="signal">${Number(event.signal_score || 0)}/5 ${esc(event.signal_label)}</div><div class="why">${esc(event.signal_reasons)}</div></div>
        <div class="price">${esc([event.duration, event.price].filter(Boolean).join(' '))}</div>
        <div class="action"><button class="add ${added ? 'added' : ''}" data-id="${esc(event.id)}">${added ? 'Added' : 'Add'}</button><a class="ticket-link" target="_blank" rel="noopener" href="${esc(ticketUrl(event))}">Box office</a></div>
        ${event.description ? `<details><summary>Description</summary><div class="desc">${esc(event.description)}</div></details>` : ''}
      </article>`;
    }

    async function toggleSchedule(eventId) {
      if (scheduleIds.has(eventId)) {
        const { error } = await supabase.from('schedule_items').delete().eq('trip_id', TRIP_ID).eq('event_id', eventId);
        if (error) return alert(error.message);
        scheduleIds.delete(eventId);
        boughtTickets.delete(eventId);
      } else {
        let { error } = await supabase.from('schedule_items').insert({ trip_id: TRIP_ID, event_id: eventId, ticket_bought: false });
        if (error && isTicketColumnError(error)) {
          ({ error } = await supabase.from('schedule_items').insert({ trip_id: TRIP_ID, event_id: eventId }));
        }
        if (error && !String(error.message).includes('duplicate')) return alert(error.message);
        scheduleIds.add(eventId);
        boughtTickets.set(eventId, false);
      }
      renderSchedule();
      updateAddButtons();
    }

    async function setTicketBought(eventId, bought) {
      boughtTickets.set(eventId, bought);
      renderSchedule();
      const { error } = await supabase
        .from('schedule_items')
        .update({ ticket_bought: bought })
        .eq('trip_id', TRIP_ID)
        .eq('event_id', eventId);
      if (error) {
        boughtTickets.set(eventId, !bought);
        renderSchedule();
        alert(isTicketColumnError(error) ? 'Run the Supabase ticket_bought migration first, then try again.' : error.message);
      }
    }

    function updateAddButtons() {
      document.querySelectorAll('.add').forEach(btn => {
        const added = scheduleIds.has(btn.dataset.id);
        btn.classList.toggle('added', added);
        btn.textContent = added ? 'Added' : 'Add';
      });
      $('scheduleTab').textContent = `My Schedule (${scheduleIds.size})`;
    }

    function renderSchedule() {
      const selected = events.filter(event => scheduleIds.has(event.id)).sort((a,b) => a.date.localeCompare(b.date) || timeToMin(a.start) - timeToMin(b.start));
      const total = selected.reduce((sum, event) => sum + Number(event.price_amount || 0), 0);
      $('scheduleCount').textContent = selected.length.toLocaleString();
      $('scheduleCost').textContent = money(total);
      if (!selected.length) {
        $('scheduleBody').className = 'empty';
        $('scheduleBody').innerHTML = 'Your shared schedule is empty. Add shows from Browse.';
        renderScheduleMap();
        return;
      }
      $('scheduleBody').className = '';
      const byDay = groupBy(selected, e => e.date);
      $('scheduleBody').innerHTML = Object.keys(byDay).sort().map(date => {
        const cards = byDay[date].map(event => {
          const start = timeToMin(event.start);
          const end = start + Number(event.duration_minutes || 60);
          const conflict = selected.some(other => other.id !== event.id && other.date === event.date && start < timeToMin(other.start) + Number(other.duration_minutes || 60) && end > timeToMin(other.start));
          const bought = boughtTickets.get(event.id) === true;
          return `<article class="schedule-card ${conflict ? 'conflict' : ''} ${bought ? 'bought' : ''}" data-map-key="${esc(venueKey(event))}">
            <div class="start">${esc(String(event.start).slice(0,5))}<br><span class="meta">${minToTime(end)}</span></div>
            <div><a class="title" target="_blank" rel="noopener" href="${esc(ticketUrl(event))}">${esc(event.title)}</a><div class="meta">${esc(event.company)}</div><div class="meta">${esc(event.duration || '')} · ${esc(event.price || 'No price listed')} · ${event.signal_score}/5 ${esc(event.signal_label)}${bought ? ' · Ticket bought' : ''}</div>${conflict ? '<div class="conflict">Time clash</div>' : ''}</div>
            <div class="venue"><a target="_blank" rel="noopener" href="${esc(event.maps_search)}">${esc(event.venue || 'Map search')}</a><div class="location">${esc(event.location)}</div></div>
            <div class="schedule-actions"><label class="bought-toggle"><input type="checkbox" data-bought="${esc(event.id)}" ${bought ? 'checked' : ''}> Bought</label><a class="ticket-link" target="_blank" rel="noopener" href="${esc(ticketUrl(event))}">Box office</a><button data-remove="${esc(event.id)}">Remove</button></div>
          </article>`;
        }).join('');
        return `<section><div class="dayhead"><h2>${days[date] || date}</h2><div class="muted">${byDay[date].length} shows</div></div>${cards}</section>`;
      }).join('');
      document.querySelectorAll('[data-remove]').forEach(btn => btn.addEventListener('click', () => toggleSchedule(btn.dataset.remove)));
      document.querySelectorAll('[data-bought]').forEach(input => input.addEventListener('change', () => setTicketBought(input.dataset.bought, input.checked)));
      attachMapHover('#scheduleBody');
      renderScheduleMap();
    }

    function groupBy(items, getKey) {
      return items.reduce((acc, item) => {
        const key = getKey(item);
        (acc[key] ||= []).push(item);
        return acc;
      }, {});
    }

    function showTab(name) {
      const schedule = name === 'schedule';
      $('browsePanel').classList.toggle('active', !schedule);
      $('schedulePanel').classList.toggle('active', schedule);
      $('browseTab').classList.toggle('active', !schedule);
      $('scheduleTab').classList.toggle('active', schedule);
      if (mapReady) {
        setTimeout(() => {
          browseMap.invalidateSize();
          scheduleMap.invalidateSize();
        }, 80);
      }
    }

    const resetAndApply = () => { displayLimit = 100; applyFilters(); };
    $('search').addEventListener('input', () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(resetAndApply, 180);
    });
    $('dateFilter').addEventListener('change', resetAndApply);
    $('startAfter').addEventListener('change', resetAndApply);
    $('startBefore').addEventListener('change', resetAndApply);
    $('minSignal').addEventListener('change', resetAndApply);
    $('browseTab').addEventListener('click', () => showTab('browse'));
    $('scheduleTab').addEventListener('click', () => { renderSchedule(); showTab('schedule'); });
    $('clearFilters').addEventListener('click', () => {
      $('search').value = '';
      $('dateFilter').value = '';
      $('startAfter').value = '';
      $('startBefore').value = '';
      $('minSignal').value = '';
      activeGenres = new Set();
      document.querySelectorAll('.genrecheck').forEach(input => input.checked = false);
      updateGenreSummary();
      displayLimit = 100;
      applyFilters();
    });
    document.querySelectorAll('[data-preset]').forEach(btn => btn.addEventListener('click', () => {
      const [from, to] = btn.dataset.preset.split('-');
      $('startAfter').value = from;
      $('startBefore').value = to;
      displayLimit = 100;
      applyFilters();
    }));
    $('clearSchedule').addEventListener('click', async () => {
      if (!confirm('Clear the shared schedule?')) return;
      const { error } = await supabase.from('schedule_items').delete().eq('trip_id', TRIP_ID);
      if (error) alert(error.message);
      scheduleIds = new Set();
      boughtTickets = new Map();
      renderSchedule();
      updateAddButtons();
    });

    supabase.channel('shared-schedule')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'schedule_items', filter: `trip_id=eq.${TRIP_ID}` }, fetchSchedule)
      .subscribe();

    try {
      await fetchAllEvents();
      await fetchSchedule();
    } catch (error) {
      console.error(error);
      $('browseBody').className = 'empty';
      $('browseBody').innerHTML = `Could not load Supabase data: ${esc(error.message)}`;
    }
  </script>
</body>
</html>
