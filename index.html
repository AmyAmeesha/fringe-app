function attachMapHover(containerSelector){document.querySelectorAll(`${containerSelector} [data-map-key]`).forEach(card=>{if(card.dataset.mapHoverBound)return;card.dataset.mapHoverBound='true';const key=card.dataset.mapKey;const markers=()=>containerSelector==='#scheduleBody'?scheduleMarkersByKey:browseMarkersByKey;card.addEventListener('mouseenter',()=>{card.classList.add('map-hover');setMarkerHighlight(markers().get(key),true)});card.addEventListener('mouseleave',()=>{card.classList.remove('map-hover');setMarkerHighlight(markers().get(key),false)})})}
async function renderBrowseMap(){const run=++browseMapRun;initMaps();if(!mapReady)return;const venues=uniqueVenues(visibleEvents.slice(0,displayLimit),120);browseLayer.clearLayers();browseMarkersByKey=new Map();if(!venues.length){$('browseMapNote').textContent=' No venues to map.';fitMap(browseMap,[]);return}const resolved=await resolveVenues(venues,$('browseMapNote'),'venues');if(run!==browseMapRun)return;resolved.forEach(venue=>{const marker=L.circleMarker([venue.lat,venue.lng],markerStyle).bindPopup(mapPopupHtml(venue)).addTo(browseLayer);browseMarkersByKey.set(venue.key,marker)});attachMapHover('#browseBody');const exact=resolved.filter(venue=>venue.exact).length;$('browseMapNote').textContent=` ${resolved.length}/${venues.length} venues mapped (${exact} exact)`;fitMap(browseMap,resolved)}
async function renderScheduleMap(){const run=++scheduleMapRun;initMaps();if(!mapReady)return;const selected=events.filter(event=>scheduleIds.has(event.id)).sort((a,b)=>a.date.localeCompare(b.date)||timeToMin(a.start)-timeToMin(b.start));const venues=uniqueVenues(selected,120);scheduleLayer.clearLayers();scheduleMarkersByKey=new Map();if(scheduleRoute){scheduleMap.removeLayer(scheduleRoute);scheduleRoute=null}$('distanceList').classList.add('hidden');$('distanceList').innerHTML='';if(!venues.length){$('scheduleMapNote').textContent=' Add shows to map your route.';fitMap(scheduleMap,[]);return}const resolved=await resolveVenues(venues,$('scheduleMapNote'),'stops');if(run!==scheduleMapRun)return;const byKey=new Map(resolved.map(venue=>[venue.key,venue]));resolved.forEach((venue,index)=>{const marker=L.circleMarker([venue.lat,venue.lng],markerStyle).bindPopup(`<strong>${index+1}. ${esc(venue.base)}</strong>${mapPopupHtml(venue).replace(/^<strong>.*?<\/strong>/,'')}`).addTo(scheduleLayer);scheduleMarkersByKey.set(venue.key,marker)});attachMapHover('#scheduleBody');const ordered=selected.map(event=>{const venue=byKey.get(venueKey(event));return venue?{event,venue,lat:venue.lat,lng:venue.lng}:null}).filter(Boolean);const legs=[];if(ordered.length>1){scheduleRoute=L.polyline(ordered.map(p=>[p.lat,p.lng]),{color:'#b92f2f',weight:3}).addTo(scheduleMap);for(let i=1;i<ordered.length;i+=1){const a=ordered[i-1],b=ordered[i];if(a.venue.key===b.venue.key)continue;const km=distanceKm(a,b);legs.push(`<div><span>${esc(a.event.title)} -> ${esc(b.event.title)}</span><strong>${km.toFixed(1)} km / ~${approxWalkMins(km)} min walk</strong></div>`)}if(legs.length){$('distanceList').innerHTML=legs.join('');$('distanceList').classList.remove('hidden')}}const exact=resolved.filter(venue=>venue.exact).length;$('scheduleMapNote').textContent=` ${resolved.length}/${venues.length} stops mapped (${exact} exact)`;fitMap(scheduleMap,resolved)}
async function fetchAllEvents(){const pageSize=1000;let from=0,all=[];while(true){const{data,error}=await supabase.from('events').select('*').order('date',{ascending:true}).order('start',{ascending:true}).range(from,from+pageSize-1);if(error)throw error;all=all.concat(data||[]);if(!data||data.length<pageSize)break;from+=pageSize}events=all;buildGenreMenu();applyFilters()}
async function fetchSchedule(){let{data,error}=await supabase.from('schedule_items').select('event_id,ticket_bought,ameesha_recommendation').eq('trip_id',TRIP_ID);if(error&&isRecommendationColumnError(error))({data,error}=await supabase.from('schedule_items').select('event_id,ticket_bought').eq('trip_id',TRIP_ID));if(error&&isTicketColumnError(error))({data,error}=await supabase.from('schedule_items').select('event_id').eq('trip_id',TRIP_ID));if(error)throw error;scheduleIds=new Set((data||[]).map(row=>row.event_id));boughtTickets=new Map((data||[]).map(row=>[row.event_id,Boolean(row.ticket_bought)]));ameeshaRecommendations=new Map((data||[]).map(row=>[row.event_id,Boolean(row.ameesha_recommendation)]));renderSchedule();updateAddButtons()}
function buildGenreMenu(){const counts=new Map();const add=value=>{const v=String(value||'').trim();if(v.length>=3&&v.length<=34)counts.set(v,(counts.get(v)||0)+1)};events.forEach(event=>{add(event.category);String(event.genre||'').split(/[,/]/).forEach(add)});const options=[...counts.entries()].sort((a,b)=>b[1]-a[1]).slice(0,48).map(([name])=>name);$('genreMenu').innerHTML=options.map(name=>`<label class="checkrow"><input class="genrecheck" type="checkbox" value="${esc(name)}"> <span>${esc(name)}</span></label>`).join('');document.querySelectorAll('.genrecheck').forEach(input=>input.addEventListener('change',()=>{if(input.checked)activeGenres.add(input.value);else activeGenres.delete(input.value);updateGenreSummary();displayLimit=100;applyFilters()}))}
function updateGenreSummary(){$('genreSummary').textContent=activeGenres.size===0?'Genres: Any':activeGenres.size===1?[...activeGenres][0]:`${activeGenres.size} genres selected`}
function eventTags(event){return[event.category,...String(event.genre||'').split(/[,/]/)].map(s=>String(s||'').trim()).filter(Boolean)}
function applyFilters(){const q=$('search').value.trim().toLowerCase(),date=$('dateFilter').value,from=$('startAfter').value?timeToMin($('startAfter').value):0,to=$('startBefore').value?timeToMin($('startBefore').value):1439,minSignal=Number($('minSignal').value||0);visibleEvents=events.filter(event=>{const startMin=timeToMin(event.start);const hay=[event.title,event.company,event.category,event.genre,event.venue,event.location,event.venue_address,event.venue_postcode,event.description,event.signal_label,event.signal_reasons].join(' ').toLowerCase();const tags=eventTags(event);return(!date||event.date===date)&&startMin>=from&&startMin<=to&&Number(event.signal_score||0)>=minSignal&&(!activeGenres.size||[...activeGenres].some(g=>tags.includes(g)))&&(!q||hay.includes(q))});$('visibleCount').textContent=visibleEvents.length.toLocaleString();const bits=[];if(date)bits.push(days[date]);bits.push(`${$('startAfter').value||'00:00'}-${$('startBefore').value||'23:59'}`);if(activeGenres.size)bits.push([...activeGenres].join(', '));if(minSignal)bits.push(`${minSignal}/5+ signal`);if(q)bits.push(`"${q}"`);$('rangeLabel').textContent=bits.join(' / ');renderBrowse();renderBrowseMap()}
function renderBrowse(){if(!visibleEvents.length){$('browseBody').className='empty';$('browseBody').innerHTML='No events match the current filters.';return}$('browseBody').className='list-pane';const renderedEvents=visibleEvents.slice(0,displayLimit),hiddenCount=Math.max(visibleEvents.length-renderedEvents.length,0),byDay=groupBy(renderedEvents,e=>e.date);$('browseBody').innerHTML=Object.keys(byDay).sort().map(date=>{const byBucket=groupBy(byDay[date],e=>e.bucket||e.start?.slice(0,5)||'00:00');return`<section><div class="dayhead"><h2>${days[date]||date}</h2><div class="muted">${byDay[date].length.toLocaleString()} events</div></div>`+Object.keys(byBucket).sort().map(bucket=>`<div class="slot"><div class="time">${esc(String(bucket).slice(0,5))}</div><div>${byBucket[bucket].map(renderEvent).join('')}</div></div>`).join('')+'</section>'}).join('')+(hiddenCount?`<div class="more-wrap"><button id="showMore">Show 100 more (${hiddenCount.toLocaleString()} hidden)</button></div>`:'');$('showMore')?.addEventListener('click',()=>{displayLimit+=100;renderBrowse();renderBrowseMap()});document.querySelectorAll('.add').forEach(btn=>btn.addEventListener('click',()=>toggleSchedule(btn.dataset.id)));attachMapHover('#browseBody');updateAddButtons()}
function renderEvent(event){const added=scheduleIds.has(event.id),tags=[event.category,event.genre].filter(Boolean).map((t,i)=>`<span class="tag ${i===0?'cat':''}">${esc(t)}</span>`).join(' '),address=venueAddress(event);return`<article class="event" data-map-key="${esc(venueKey(event))}"><div class="start">${esc(String(event.start).slice(0,5))}</div><div><div class="title-row"><a class="title" target="_blank" rel="noopener" href="${esc(ticketUrl(event))}">${esc(event.title)}</a><button class="add ${added?'added':''}" data-id="${esc(event.id)}">${added?'Added':'Add'}</button></div><div class="meta">${esc(event.company)}</div>${tags}</div><div class="venue"><a target="_blank" rel="noopener" href="${esc(mapsUrl(event))}">${esc(event.venue||'Map search')}</a><div class="location">${esc([event.location,address].filter(Boolean).join(' / '))}</div></div><div class="signalwrap"><div class="signal">${Number(event.signal_score||0)}/5 ${esc(event.signal_label)}</div><div class="why">${esc(event.signal_reasons)}</div></div><div class="price">${esc([event.duration,event.price].filter(Boolean).join(' '))}</div><div class="action"><a class="ticket-link" target="_blank" rel="noopener" href="${esc(ticketUrl(event))}">Box office</a></div>${event.description?`<details><summary>Description</summary><div class="desc">${esc(event.description)}</div></details>`:''}</article>`}
async function toggleSchedule(eventId){if(scheduleIds.has(eventId)){const{error}=await supabase.from('schedule_items').delete().eq('trip_id',TRIP_ID).eq('event_id',eventId);if(error)return alert(error.message);scheduleIds.delete(eventId);boughtTickets.delete(eventId);ameeshaRecommendations.delete(eventId)}else{let{error}=await supabase.from('schedule_items').insert({trip_id:TRIP_ID,event_id:eventId,ticket_bought:false,ameesha_recommendation:false});if(error&&isRecommendationColumnError(error))({error}=await supabase.from('schedule_items').insert({trip_id:TRIP_ID,event_id:eventId,ticket_bought:false}));if(error&&isTicketColumnError(error))({error}=await supabase.from('schedule_items').insert({trip_id:TRIP_ID,event_id:eventId}));if(error&&!String(error.message).includes('duplicate'))return alert(error.message);scheduleIds.add(eventId);boughtTickets.set(eventId,false);ameeshaRecommendations.set(eventId,false)}renderSchedule();updateAddButtons()}
async function setTicketBought(eventId,bought){boughtTickets.set(eventId,bought);renderSchedule();const{error}=await supabase.from('schedule_items').update({ticket_bought:bought}).eq('trip_id',TRIP_ID).eq('event_id',eventId);if(error){boughtTickets.set(eventId,!bought);renderSchedule();alert(isTicketColumnError(error)?'Run the Supabase ticket_bought migration first, then try again.':error.message)}}
async function setAmeeshaRecommendation(eventId,recommended){ameeshaRecommendations.set(eventId,recommended);renderSchedule();const{error}=await supabase.from('schedule_items').update({ameesha_recommendation:recommended}).eq('trip_id',TRIP_ID).eq('event_id',eventId);if(error){ameeshaRecommendations.set(eventId,!recommended);renderSchedule();alert(isRecommendationColumnError(error)?'Run the Supabase ameesha_recommendation migration first, then try again.':error.message)}}
function updateAddButtons(){document.querySelectorAll('.add').forEach(btn=>{const added=scheduleIds.has(btn.dataset.id);btn.classList.toggle('added',added);btn.textContent=added?'Added':'Add'});$('scheduleTab').textContent=`My Schedule (${scheduleIds.size})`}
function renderSchedule(){const selected=events.filter(event=>scheduleIds.has(event.id)).sort((a,b)=>a.date.localeCompare(b.date)||timeToMin(a.start)-timeToMin(b.start));const total=selected.reduce((sum,event)=>sum+Number(event.price_amount||0),0);$('scheduleCount').textContent=selected.length.toLocaleString();$('scheduleCost').textContent=money(total);if(!selected.length){$('scheduleBody').className='empty';$('scheduleBody').innerHTML='Your shared schedule is empty. Add shows from Browse.';renderScheduleMap();return}$('scheduleBody').className='list-pane';const byDay=groupBy(selected,e=>e.date);$('scheduleBody').innerHTML=Object.keys(byDay).sort().map(date=>{const cards=byDay[date].map(event=>{const start=timeToMin(event.start),end=start+Number(event.duration_minutes||60),conflict=selected.some(other=>other.id!==event.id&&other.date===event.date&&start<timeToMin(other.start)+Number(other.duration_minutes||60)&&end>timeToMin(other.start)),bought=boughtTickets.get(event.id)===true,recommended=ameeshaRecommendations.get(event.id)===true,address=venueAddress(event);return`<article class="schedule-card ${conflict?'conflict':''} ${bought?'bought':''} ${recommended?'recommended':''}" data-map-key="${esc(venueKey(event))}"><div class="start">${esc(String(event.start).slice(0,5))}<br><span class="meta">${minToTime(end)}</span></div><div><a class="title" target="_blank" rel="noopener" href="${esc(ticketUrl(event))}">${esc(event.title)}</a>${recommended?'<span class="rec-badge">Ameesha rec</span>':''}<div class="meta">${esc(event.company)}</div><div class="meta">${esc(event.duration||'')} / ${esc(event.price||'No price listed')} / ${event.signal_score}/5 ${esc(event.signal_label)}${bought?' / Ticket bought':''}</div>${conflict?'<div class="conflict">Time clash</div>':''}</div><div class="venue"><a target="_blank" rel="noopener" href="${esc(mapsUrl(event))}">${esc(event.venue||'Map search')}</a><div class="location">${esc([event.location,address].filter(Boolean).join(' / '))}</div></div><div class="schedule-actions"><label class="bought-toggle"><input type="checkbox" data-bought="${esc(event.id)}" ${bought?'checked':''}> Bought</label><label class="bought-toggle recommend-toggle"><input type="checkbox" data-recommend="${esc(event.id)}" ${recommended?'checked':''}> Ameesha rec</label><a class="ticket-link" target="_blank" rel="noopener" href="${esc(ticketUrl(event))}">Box office</a><button data-remove="${esc(event.id)}">Remove</button></div></article>`}).join('');return`<section><div class="dayhead"><h2>${days[date]||date}</h2><div class="muted">${byDay[date].length} shows</div></div>${cards}</section>`}).join('');document.querySelectorAll('[data-remove]').forEach(btn=>btn.addEventListener('click',()=>toggleSchedule(btn.dataset.remove)));document.querySelectorAll('[data-bought]').forEach(input=>input.addEventListener('change',()=>setTicketBought(input.dataset.bought,input.checked)));document.querySelectorAll('[data-recommend]').forEach(input=>input.addEventListener('change',()=>setAmeeshaRecommendation(input.dataset.recommend,input.checked)));attachMapHover('#scheduleBody');renderScheduleMap()}
function groupBy(items,getKey){return items.reduce((acc,item)=>{const key=getKey(item);(acc[key]||=[]).push(item);return acc},{})}
function showTab(name){const schedule=name==='schedule';$('browsePanel').classList.toggle('active',!schedule);$('schedulePanel').classList.toggle('active',schedule);$('browseTab').classList.toggle('active',!schedule);$('scheduleTab').classList.toggle('active',schedule);if(mapReady)setTimeout(()=>{browseMap.invalidateSize();scheduleMap.invalidateSize()},80)}
const resetAndApply=()=>{displayLimit=100;applyFilters()};
$('search').addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(resetAndApply,180)});$('dateFilter').addEventListener('change',resetAndApply);$('startAfter').addEventListener('change',resetAndApply);$('startBefore').addEventListener('change',resetAndApply);$('minSignal').addEventListener('change',resetAndApply);
document.addEventListener('click',event=>{const zoom=event.target.closest('[data-map-zoom]');if(!zoom)return;const[scope,action]=zoom.dataset.mapZoom.split(':'),map=scope==='schedule'?scheduleMap:browseMap;if(!map)return;if(action==='in')map.zoomIn();if(action==='out')map.zoomOut();if(action==='reset'){if(scope==='schedule')renderScheduleMap();else renderBrowseMap()}});
$('browseTab').addEventListener('click',()=>showTab('browse'));$('scheduleTab').addEventListener('click',()=>{renderSchedule();showTab('schedule')});$('clearFilters').addEventListener('click',()=>{$('search').value='';$('dateFilter').value='';$('startAfter').value='';$('startBefore').value='';$('minSignal').value='';activeGenres=new Set();document.querySelectorAll('.genrecheck').forEach(input=>input.checked=false);updateGenreSummary();displayLimit=100;applyFilters()});document.querySelectorAll('[data-preset]').forEach(btn=>btn.addEventListener('click',()=>{const[from,to]=btn.dataset.preset.split('-');$('startAfter').value=from;$('startBefore').value=to;displayLimit=100;applyFilters()}));$('clearSchedule').addEventListener('click',async()=>{if(!confirm('Clear the shared schedule?'))return;const{error}=await supabase.from('schedule_items').delete().eq('trip_id',TRIP_ID);if(error)alert(error.message);scheduleIds=new Set();boughtTickets=new Map();ameeshaRecommendations=new Map();renderSchedule();updateAddButtons()});
supabase.channel('shared-schedule').on('postgres_changes',{event:'*',schema:'public',table:'schedule_items',filter:`trip_id=eq.${TRIP_ID}`},fetchSchedule).subscribe();
try{await fetchAllEvents();await fetchSchedule()}catch(error){console.error(error);$('browseBody').className='empty';$('browseBody').innerHTML=`Could not load Supabase data: ${esc(error.message)}`}
</script>
